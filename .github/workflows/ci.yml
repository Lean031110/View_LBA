name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Tipos · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Generar Prisma Client
        run: bunx prisma generate

      - name: Lint (ESLint)
        run: bun run lint

      - name: Tipos (TypeScript)
        run: bun run typecheck

      - name: Tests (bun test)
        run: bun test

      - name: Build de producción (Next.js standalone)
        run: bun run build
