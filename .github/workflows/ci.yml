name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Secretos DUMMY solo para que la validación de entorno (src/lib/env.ts)
  # no falle en CI. Nunca son secretos reales; la producción usa los suyos.
  AUTH_SECRET: ci-dummy-secret-0123456789abcdef0123456789
  REALTIME_TOKEN: ci-dummy-rt-token-0123456789abcdef
  DATABASE_URL: file:./db/ci-quality.db

jobs:
  # ---------------------------------------------------------------- 1. Calidad
  quality:
    name: Calidad (lint · tipos · unit+services · build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun (versión exacta)
        uses: oven-sh/setup-bun@v2
        with:
          # versión EXACTA (reproducible). OJO: el input `cache` NO está
          # soportado por la versión actual de setup-bun@v2 (warning) — no usarlo.
          bun-version: "1.4.2"

      - name: Instalar dependencias (reproducible)
        run: bun install --frozen-lockfile

      - name: Instalar dependencias de mini-servicios
        # stream-service y realtime-service tienen package.json propio
        run: |
          (cd mini-services/realtime-service && bun install --frozen-lockfile)
          (cd mini-services/stream-service && bun install --frozen-lockfile)

      - name: Instalar ffmpeg (publisher RTMP de los tests de pipeline)
        # ubuntu-latest ya NO incluye ffmpeg — necesario para stream-pipeline
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Coherencia de versión (única fuente de verdad /VERSION)
        # FASE 5 de la release 3.0.0: /VERSION == package.json == CHANGELOG ==
        # gradle derivado == sin hardcodeos en workflows. Fail si diverge.
        run: bun scripts/check-version.ts

      - name: Coherencia de documentación (README/enlaces/badges)
        # Gate de docs: badges al repo real, workflows de los badges existentes,
        # git clone correcto, enlaces relativos existentes, índice de docs
        # completo, screenshots presentes y conteos E2E/tests fieles al código.
        # Regresión histórica que impide: el README decía "Pantalla_Restaurante"
        # cuando el repo real es "View_LBA", y "37 specs" cuando había 9.
        run: bun scripts/check-docs.ts

      - name: Generar Prisma Client
        run: bunx prisma generate

      - name: Lint (ESLint)
        run: bun run lint

      - name: Tipos (TypeScript)
        run: bun run typecheck

      - name: Tipos del instalador y la bandeja (TypeScript estricto)
        # installer/ + scripts/ antes NO estaban tipados (solo corrían con
        # bun). Este gate habría cazado a tiempo el require() de la bandeja
        # y el import roto de scripts/restore.ts (purgeInvalidThemes).
        run: bun run typecheck:installer

      - name: Tests unit + mini-services + pipeline de streaming
        # 776 tests / 47 suites: unit, realtime-service (spawn propio
        # :3103/:3104), stream-pipeline FASE 23 (spawn propio
        # :1935/:8000/:8100 + next :3100, publisher ffmpeg real), installer
        # (CLI + adaptadores + bandeja D-Bus con dbus-daemon real) y temas.
        # Los de integración se omiten aquí SIN servidor (visible en salida)
        # — corren de verdad en el job integration.
        run: bun test

      - name: Build de producción (Next.js standalone)
        run: bun run build

  # ------------------------------------------------------- 2. Integración (API)
  integration:
    name: Integración (API contra servidor real)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun (versión exacta)
        uses: oven-sh/setup-bun@v2
        with:
          # versión EXACTA (reproducible). OJO: el input `cache` NO está
          # soportado por la versión actual de setup-bun@v2 (warning) — no usarlo.
          bun-version: "1.4.2"

      - name: Instalar dependencias (reproducible)
        run: bun install --frozen-lockfile

      - name: Generar Prisma Client
        run: bunx prisma generate

      - name: Preparar DB de integración (migrate deploy + seed demo)
        # Misma DB aislada que usa el E2E: migraciones versionadas + usuarios demo
        run: bun scripts/e2e-setup.ts

      - name: Arrancar servidor (dev) con la DB de integración
        # LICENSING v2: overrides de identidad + claves públicas DUMMY de test
        # para que el token activado por e2e-setup valide como ACTIVA y los
        # códigos VLREQ2 se sellen hacia el emisor DUMMY (mismos valores que
        # playwright.config.ts; claves de e2e/fixtures/licensing).
        run: |
          DATABASE_URL="file:../db/e2e.db" \
          AUTH_SECRET="${{ env.AUTH_SECRET }}" \
          REALTIME_TOKEN="${{ env.REALTIME_TOKEN }}" \
          LOGIN_RATE_LIMIT_IP_MAX=500 \
          VIEWLBA_TEST_DEVICE_FINGERPRINT="00946114a3a48905be6f60d95f945a1b29f3f2b261e32f30521afed84407f8e7" \
          VIEWLBA_TEST_DISK_ID_HASH="a5ed432a37dde11ef146fcc98049c07d06e0db193cc1cf69dc2214d7b2cc8b02" \
          VIEWLBA_TEST_INSTALL_PATH="/srv/viewlba-e2e" \
          VIEWLBA_LICENSE_PUBLIC_KEY="GDEuTLCbpriQyXbECGbffdgTa52f-YHPjp-lVhvjxd0" \
          VIEWLBA_REQUEST_PUBLIC_KEY="qWlCO6xJt2e_AZjNxDZ2olv_DiJBNuLHNBGSLm87pjE" \
            nohup bunx next dev -p 3000 > dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid

      - name: Esperar health del servidor
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "✓ servidor listo (intento $i)"; exit 0
            fi
            sleep 2
          done
          echo "✗ el servidor no arrancó"; tail -n 50 dev-server.log; exit 1

      - name: Tests de integración (rutas API reales)
        run: DATABASE_URL="file:../db/e2e.db" APP_URL=http://127.0.0.1:3000 bun test tests/integration/api.test.ts

      - name: Parar servidor (:3000) antes de la suite de licencias
        # OBLIGATORIO: Next 16 impide dos `next dev` en el mismo directorio
        # ("⨯ Another next dev server is already running"). La suite de
        # licencias levanta el SUYO en :3300 una vez libre este.
        run: |
          kill $(cat /tmp/dev-server.pid) 2>/dev/null || true
          pkill -f "next dev" 2>/dev/null || true
          sleep 2

      - name: Tests de integración de licencias (spawn propio :3300)
        # Suite autocontenida: DB temporal + migraciones + admin + anclas de
        # trial frescas + identidad de test. Cubre request-code VLREQ2,
        # activación por token (válido/tamper/mismatch), trial + watermark
        # público, gating 403, renovación y anti-downgrade.
        run: DATABASE_URL="file:./db/lic-int.db" bun test tests/integration/license-api.test.ts

      - name: Logs del servidor (solo en fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-dev-server-log
          path: dev-server.log
          retention-days: 7

  # ------------------------------------------------------------------- 3. E2E
  e2e:
    name: E2E (Playwright · 52 tests / 22 escenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun (versión exacta)
        uses: oven-sh/setup-bun@v2
        with:
          # versión EXACTA (reproducible). OJO: el input `cache` NO está
          # soportado por la versión actual de setup-bun@v2 (warning) — no usarlo.
          bun-version: "1.4.2"

      - name: Instalar dependencias (reproducible)
        run: bun install --frozen-lockfile

      - name: Instalar dependencias de mini-servicios
        # los webServer de Playwright arrancan realtime + stream-service
        run: |
          (cd mini-services/realtime-service && bun install --frozen-lockfile)
          (cd mini-services/stream-service && bun install --frozen-lockfile)

      - name: Instalar ffmpeg (escenarios de stream E2E #13/#14)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generar Prisma Client
        run: bunx prisma generate

      - name: Cache de navegadores Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Instalar Chromium para Playwright
        run: bunx playwright install --with-deps chromium

      - name: Preparar DB E2E (migrate deploy + seed demo + VIEWER + streamKey)
        run: bun scripts/e2e-setup.ts

      - name: Tests E2E (bootean app + realtime + stream ellos mismos)
        run: bunx playwright test

      - name: Artefactos de fallo (traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------- 4. Seguridad
  security:
    name: Seguridad (dependencias)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action en eventos pull_request lista los commits del PR vía
    # API (ScanPullRequest) → sin pull-requests:read responde 403
    # "Resource not accessible by integration" y el job falla (visto en el
    # run #34520256044 del PR #1). Permisos mínimos, solo lectura.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Historia COMPLETA: gitleaks escanea el rango del push (before..after)
      # y con clon superficial el commit base no existe → git falla y el job
      # se rompe (visto en el push de 16 commits de cf09174).
      - name: Checkout (historia completa para gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Bun (versión exacta)
        uses: oven-sh/setup-bun@v2
        with:
          # versión EXACTA (reproducible). OJO: el input `cache` NO está
          # soportado por la versión actual de setup-bun@v2 (warning) — no usarlo.
          bun-version: "1.4.2"

      - name: Instalar dependencias (reproducible)
        run: bun install --frozen-lockfile

      # BLOQUEANTE: ninguna vulnerabilidad CRÍTICA es aceptable.
      - name: Auditoría de dependencias (críticas — bloqueante)
        run: bun audit --audit-level=critical

      # REGISTRO: el reporte completo se registra como warning del run.
      # Contexto (documentado en PRODUCTION_PLAN FASE 24): las vulnerabilidades
      # restantes viven en cadenas DEV/CLI (eslint→babel→browserslist,
      # prisma-config, picomatch/minimatch) que NO forman parte del binario
      # de producción (standalone). Dependencias de runtime ya saneadas
      # (js-cookie/lodash eliminadas por no usarse).
      - name: Auditoría completa (registro, no bloqueante)
        run: bun audit || echo "::warning::Vulnerabilidades registradas (cadenas dev/CLI, ver PRODUCTION_PLAN FASE 24)"

      # FASE 30: NINGÚN secreto real en el historial git (bloqueante).
      # Allowlist estricto (.gitleaks.toml): solo fixtures DUMMY de tests.
      - name: Escaneo de secretos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
