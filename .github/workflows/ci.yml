name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Tipos · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Generar Prisma Client
        run: bunx prisma generate

      - name: Lint (ESLint)
        run: bun run lint
        env:
          # Secretos dummy SOLO para que el build/validación no fallen en CI
          # (nunca son secretos reales; el runtime de producción usa los suyos)
          AUTH_SECRET: ci-dummy-secret-0123456789abcdef0123456789
          REALTIME_TOKEN: ci-dummy-rt-token-0123456789abcdef
          DATABASE_URL: file:./ci-build.db

      - name: Tipos (TypeScript)
        run: bun run typecheck
        env:
          AUTH_SECRET: ci-dummy-secret-0123456789abcdef0123456789
          REALTIME_TOKEN: ci-dummy-rt-token-0123456789abcdef
          DATABASE_URL: file:./ci-build.db

      - name: Tests (bun test)
        run: bun test
        env:
          AUTH_SECRET: ci-dummy-secret-0123456789abcdef0123456789
          REALTIME_TOKEN: ci-dummy-rt-token-0123456789abcdef
          DATABASE_URL: file:./ci-build.db

      - name: Build de producción (Next.js standalone)
        run: bun run build
        env:
          AUTH_SECRET: ci-dummy-secret-0123456789abcdef0123456789
          REALTIME_TOKEN: ci-dummy-rt-token-0123456789abcdef
          DATABASE_URL: file:./ci-build.db
