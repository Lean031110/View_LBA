name: Android Emulator Smoke

# FASE 7 (release 3.0.0) — INSTALACIÓN REAL del APK en un emulador.
#
# Job SEPARADO del pipeline de release (el emulador puede ser inestable en
# CI): NO bloquea la publicación de artifacts, pero produce EVIDENCIA de
# instalación real. El pipeline bloqueante de validación binaria (apksigner,
# zipalign, badging) vive en .github/actions/android-apk.
#
# DESDE v3.1.0: además de «el proceso está vivo», verifica FUNCIONALMENTE
# que la APK PASA LA PRIMERA PANTALLA (configuración del PIN) con un PIN
# de ejemplo, llega a HOME, persiste el vault y se desbloquea de nuevo
# (más control negativo: un PIN incorrecto NO desbloquea).
# Ver scripts/apk-first-screen-check.sh.
#
# Se dispara: manualmente (workflow_dispatch), en cada tag v* (RC y final)
# y en cada push a main (regresión funcional del APK visible de inmediato).

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: "Emulador API 35: install · PRIMERA PANTALLA (PIN) · HOME · unlock"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: "Versión (tag o /VERSION)"
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(cat VERSION); fi
          echo "APK_VERSION=$V" >> "$GITHUB_ENV"
          echo "→ versión: $V"

      - name: "KVM disponible (requisito del emulador)"
        run: |
          set -euo pipefail
          test -e /dev/kvm && (sudo chmod 777 /dev/kvm || true) && echo "✓ KVM presente" \
            || { echo "::error::Este runner no tiene KVM — el smoke no puede correr aquí"; exit 1; }

      # Mismo pipeline firmado (lint/tests/sign/verify) → APK en disco
      - name: "APK firmado y verificado (action compuesto)"
        uses: ./.github/actions/android-apk
        env:
          KEYSTORE_BASE64: ${{ secrets.VIEWLBA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIEWLBA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIEWLBA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIEWLBA_KEY_PASSWORD }}
        with:
          version-name: ${{ env.APK_VERSION }}
          artifact-name: viewlba-emulator-smoke

      # EVIDENCIA del rc.1: el emulador moderno exige ~7.4 GB de userdata y
      # el runner llega con ~7.1 GB tras el build («Not enough space to create
      # userdata partition»). El APK ya está en disco: se liberan caches e
      # imágenes de sistema preinstaladas que este job no usa.
      - name: "Liberar disco para el emulador (userdata ~7.4 GB)"
        run: |
          set -euo pipefail
          rm -rf ~/.gradle/caches ~/.gradle/wrapper
          rm -rf "$ANDROID_HOME/system-images"/* || true
          df -h / | tail -1

      # Instalación + verificación FUNCIONAL en emulador REAL API 35:
      # la APK debe pasar la primera pantalla (PIN de ejemplo) → HOME →
      # relanzamiento → desbloqueo → HOME. PIN INCORRECTO → rechazado.
      # El script es AUTOCONTENIDO (una sola línea: la action ejecuta cada
      # línea del script en un `sh -c` aparte — ver NOTA CRÍTICA de abajo).
      - name: "Emulador: instalar, pasar la primera pantalla (PIN) y evidenciar"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          # NOTA CRÍTICA (evidencia rc.2/rc.3): la action ejecuta el script
          # LÍNEA A LÍNEA en procesos `sh -c` SEPARADOS (dash, POSIX puro):
          #   · NO hay variables que persistan entre líneas ($APK llegaba VACÍO)
          #   · NO vale 'set -o pipefail' (fallo rc.2)
          # → cada línea es AUTOCONTENIDA, con rutas literales y la versión
          #   expandida por GitHub (${{ env.APK_VERSION }}) en tiempo de parse.
          script: |
            bash scripts/apk-first-screen-check.sh 131313 android-license-generator/app/build/outputs/apk/release/ViewLBA-License-Generator-v${{ env.APK_VERSION }}.apk
            adb logcat -d | grep -E "FATAL EXCEPTION" | tail -20 || echo "sin FATAL EXCEPTION en logcat (correcto)"

      - name: "Subir evidencia (screenshots del flujo PIN + UI dumps)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewlba-emulator-evidence
          path: |
            /tmp/viewlba-first-screen/
          retention-days: 30
          if-no-files-found: ignore
