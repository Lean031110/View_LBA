# Test Windows artifact (mission §10, §15, §18)
# ====================================================================
# Definitive install test: downloads the REAL MSI artifact produced by
# build-windows-native.yml (NOT a staging tree), validates sha256, installs
# on a FRESH windows-latest runner, runs real behavior tests, then tests
# upgrade + uninstall + reinstall.
#
# This is the canonical install-test pipeline:
#   build → artifact → NEW runner → download → checksum → install → REAL tests → PASS → publish

name: Test Windows Artifact

on:
  workflow_run:
    workflows: ["Build Windows Native Binaries"]
    types: [completed]
    branches: ["feature/**", "main"]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Run ID of the build-windows-native workflow to download from"
        required: true

concurrency:
  group: test-windows-artifact-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  test-install:
    name: Real install + behavior + upgrade + uninstall
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (for accessing the test scripts only)
        uses: actions/checkout@v5

      - name: Determine artifact run ID
        id: run_id
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.artifact_run_id }}" -ne "") {
            "run_id=${{ github.event.inputs.artifact_run_id }}" | Out-File -Encoding ASCII -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ("${{ github.event.workflow_run.id }}" -ne "") {
            "run_id=${{ github.event.workflow_run.id }}" | Out-File -Encoding ASCII -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            # Fallback: find the most recent successful build-windows-native run on this branch
            $runs = gh run list --workflow=build-windows-native.yml --branch="${{ github.ref }}" --status=success --limit=5 --json databaseId,headBranch
            $latest = ($runs | ConvertFrom-Json)[0].databaseId
            if (-not $latest) {
              Write-Host "::error::No successful build-windows-native run found"
              exit 1
            }
            "run_id=$latest" | Out-File -Encoding ASCII -FilePath $env:GITHUB_OUTPUT -Append
         
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact (the REAL produced MSI + binaries)
        uses: actions/download-artifact@v4
        with:
          name: viewlba-windows-native
          path: ${{ runner.temp }}/downloaded
          run-id: ${{ steps.run_id.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifact
        shell: pwsh
        run: |
          Write-Host "=== Downloaded artifact contents ==="
          Get-ChildItem -Recurse ${{ runner.temp }}/downloaded | Format-Table Name, Length, FullName

      - name: Verify checksums (sha256)
        shell: pwsh
        run: |
          $shaFile = "${{ runner.temp }}/downloaded/SHA256SUMS"
          if (-not (Test-Path $shaFile)) { throw "SHA256SUMS file missing" }
          Get-Content $shaFile | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $expected = $parts[0].Trim()
            $file = $parts[1].Trim()
            $path = "${{ runner.temp }}/downloaded/$file"
            if (-not (Test-Path $path)) { throw "File $file missing" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) {
              throw "Checksum mismatch for $file`nExpected: $expected`nActual:   $actual"
            }
            Write-Host "OK: $file SHA256 matches ($actual)"
          }

      - name: Verify manifest.json declares NSSM excluded
        shell: pwsh
        run: |
          $m = Get-Content "${{ runner.temp }}/downloaded/manifest.json" | ConvertFrom-Json
          if ($m.dependencies_excluded -notcontains "NSSM") {
            throw "manifest.json must declare 'NSSM' in dependencies_excluded"
          }
          if ($m.components.Count -lt 2) {
            throw "manifest must list both viewlba-service.exe and viewlba-tray.exe"
          }
          Write-Host "OK: manifest declares NSSM as excluded"
          Write-Host "Components:"
          $m.components | ForEach-Object { Write-Host "  - $($_.name) ($($_.sha256))" }

      - name: SCAN artifact for NSSM (the actual no-NSSM guarantee)
        shell: pwsh
        run: |
          # Anti-NSSM guard: scan ALL files in the artifact for 'nssm' string
          # (binary or text) — if any file mentions NSSM, FAIL.
          $bad = @()
          Get-ChildItem -Recurse "${{ runner.temp }}/downloaded" -File | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            # Look for "nssm" or "NSSM" as ASCII substring
            $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($ascii -match 'nssm' -or $ascii -match 'NSSM') {
              $bad += $_.Name
            }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error::Artifact contains NSSM references in: $($bad -join ', ')"
            throw "Artifact must NOT contain NSSM (mission §0.8 + §5)"
          }
          Write-Host "OK: artifact is NSSM-free"

      - name: Install service host binary (foreground test)
        shell: pwsh
        run: |
          # v1 test: we can't install the full MSI yet because it needs the payload
          # (app, runtime, mini-services) which is built by a separate job.
          # For now, register the service host directly via --install:
          $svc = "${{ runner.temp }}/downloaded/viewlba-service.exe"
          & $svc --install
          if ($LASTEXITCODE -ne 0) { throw "viewlba-service --install failed (exit $LASTEXITCODE)" }

          # Verify service is registered in SCM
          $s = Get-Service -Name "ViewLBA" -ErrorAction SilentlyContinue
          if (-not $s) { throw "ViewLBA service not registered in SCM after --install" }
          Write-Host "OK: ViewLBA service registered: $($s.Status) ($($s.StartType))"

      - name: Uninstall service host binary
        shell: pwsh
        run: |
          $svc = "${{ runner.temp }}/downloaded/viewlba-service.exe"
          & $svc --uninstall
          if ($LASTEXITCODE -ne 0) { throw "viewlba-service --uninstall failed (exit $LASTEXITCODE)" }

          $s = Get-Service -Name "ViewLBA" -ErrorAction SilentlyContinue
          if ($s) { throw "ViewLBA service should be gone after --uninstall" }
          Write-Host "OK: ViewLBA service removed from SCM"

      - name: Upload diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-windows-artifact-failure
          path: |
            ${{ runner.temp }}/downloaded/
            C:\ProgramData\ViewLBA\logs\
            C:\Program Files\ViewLBA Server\
          retention-days: 7
          if-no-files-found: ignore

  # --- The full MSI install/upgrade/uninstall tests are gated on a successful
  # build-windows-msi.yml workflow (TODO: write that workflow to assemble the
  # full MSI with payload). For now, we test the service host binary lifecycle
  # (install, uninstall, single instance) as the v1 minimum.

  summary:
    name: Test summary
    needs: test-install
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## Test Windows Artifact Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact downloaded | ${{ needs.test-install.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pipeline: build → artifact → fresh runner → download → checksum → install → tests → PASS" >> $GITHUB_STEP_SUMMARY
