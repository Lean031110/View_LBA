# Build Rust crates for Windows installer (mission §4, §14)
#
# Compiles:
#   - installer/native/windows-service (viewlba-service.exe)
#   - installer/native/windows-tray    (viewlba-tray.exe)
#
# Both as x86_64-pc-windows-msvc release binaries.
# Uploads:
#   - viewlba-service.exe + sha256
#   - viewlba-tray.exe    + sha256
#   - manifest.json (commit, date, runtime version, components, checksums)
#
# This is the FIRST half of the canonical install pipeline:
#   build → artifact → fresh runner → download → checksum → install → real tests

name: Build Windows Native Binaries

on:
  push:
    branches: ["main", "feature/**"]
    paths:
      - "installer/native/**"
      - ".github/workflows/build-windows-native.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "installer/native/**"
      - ".github/workflows/build-windows-native.yml"
  workflow_dispatch:

concurrency:
  group: build-windows-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-rust-binaries:
    name: Build viewlba-service.exe + viewlba-tray.exe
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      service_sha256: ${{ steps.sha.outputs.service_sha256 }}
      tray_sha256: ${{ steps.sha.outputs.tray_sha256 }}
      manifest_path: ${{ steps.manifest.outputs.manifest_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "installer/native -> target"

      - name: Print environment
        run: |
          cargo --version
          rustc --version
          where cl.exe 2>nul || echo "MSVC linker not in PATH (will use rust default)"

      - name: Verify workspace structure
        run: |
          dir installer\native\
          type installer\native\Cargo.toml
          dir installer\native\windows-service\src
          dir installer\native\windows-tray\src

      - name: Cargo fmt check
        working-directory: installer/native
        run: cargo fmt --all -- --check
        continue-on-error: true  # warn-only for v1

      - name: Cargo clippy (warn-only)
        working-directory: installer/native
        run: cargo clippy --all-targets --release -- -D warnings
        continue-on-error: true  # warn-only for v1

      - name: Build viewlba-service (release, MSVC)
        working-directory: installer/native
        run: cargo build --release --bin viewlba-service --target x86_64-pc-windows-msvc

      - name: Build viewlba-tray (release, MSVC)
        working-directory: installer/native
        run: cargo build --release --bin viewlba-tray --target x86_64-pc-windows-msvc

      - name: Stage binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist\windows-native | Out-Null
          Copy-Item installer\native\target\x86_64-pc-windows-msvc\release\viewlba-service.exe dist\windows-native\
          Copy-Item installer\native\target\x86_64-pc-windows-msvc\release\viewlba-tray.exe    dist\windows-native\

          # SHA256 — standard sha256sum format: "<hash>  <filename>" (hash first)
          $svcHash = (Get-FileHash dist\windows-native\viewlba-service.exe -Algorithm SHA256).Hash.ToLower()
          $trayHash = (Get-FileHash dist\windows-native\viewlba-tray.exe -Algorithm SHA256).Hash.ToLower()
          "$svcHash  viewlba-service.exe" | Out-File -Encoding ASCII dist\windows-native\SHA256SUMS
          "$trayHash  viewlba-tray.exe" | Add-Content -Encoding ASCII dist\windows-native\SHA256SUMS
          Write-Host "Service SHA256: $svcHash"
          Write-Host "Tray SHA256:    $trayHash"
          "service_sha256=$svcHash" | Out-File -Encoding ASCII -FilePath $env:GITHUB_OUTPUT -Append
          "tray_sha256=$trayHash"    | Out-File -Encoding ASCII -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate manifest.json
        id: manifest
        shell: pwsh
        run: |
          # Version from the SINGLE SOURCE OF TRUTH: VERSION file in the repo root
          # (misión §7 — no hardcoded versions in workflows or binaries)
          $version = (Get-Content VERSION -ErrorAction Stop).Trim()
          Write-Host "Repo version (from VERSION file): $version"

          # Source commit SHA: pull_request head.sha when PR, github.sha for push/tag
          # (misión §8 — NO use the merge commit SHA generated by GitHub for PR context)
          $sourceSha = if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $env:PR_HEAD_SHA
          } else {
            $env:GITHUB_SHA
          }
          if (-not $sourceSha) { $sourceSha = $env:GITHUB_SHA }
          Write-Host "Source commit SHA: $sourceSha"

          $date = (Get-Date).ToUniversalTime().ToString("o")
          $svcHash = (Get-FileHash dist\windows-native\viewlba-service.exe -Algorithm SHA256).Hash.ToLower()
          $trayHash = (Get-FileHash dist\windows-native\viewlba-tray.exe -Algorithm SHA256).Hash.ToLower()
          $rustVer = (rustc --version)

          $manifest = @{
            version = $version
            source_commit_sha = $sourceSha
            workflow_sha = $env:GITHUB_SHA
            merge_sha = if ($env:GITHUB_REF -like "refs/pull/*") { $env:GITHUB_SHA } else { $null }
            build_date = $date
            platform = "windows"
            architecture = "x86_64"
            rust_version = $rustVer
            installer_version = "viewlba-service $version"
            components = @(
              @{ name = "viewlba-service.exe"; sha256 = $svcHash; role = "service host"; size_bytes = (Get-Item dist\windows-native\viewlba-service.exe).Length }
              @{ name = "viewlba-tray.exe";    sha256 = $trayHash; role = "tray binary"; size_bytes = (Get-Item dist\windows-native\viewlba-tray.exe).Length }
            )
            build_reproducibility = @{
              rust_target = "x86_64-pc-windows-msvc"
              profile = "release"
              lto = $true
              panic = "abort"
            }
            dependencies_excluded = @("NSSM", "PowerShell", "CMD", "sc.exe", "find.exe")
            notes = "Smoke test artifact — Rust binaries only. NOT the full product (no payload, no MSI). Full product install test pending — see TODO in workflow."
          }
          $manifest | ConvertTo-Json -Depth 6 | Out-File -Encoding UTF8 dist\windows-native\manifest.json
          Write-Host "Manifest written to dist\windows-native\manifest.json"
          Get-Content dist\windows-native\manifest.json
          "manifest_path=dist\windows-native\manifest.json" | Out-File -Encoding ASCII -FilePath $env:GITHUB_OUTPUT -Append
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Verify manifest is valid JSON
        shell: pwsh
        run: |
          $j = Get-Content dist\windows-native\manifest.json | ConvertFrom-Json
          if ($j.components.Count -ne 2) { throw "manifest missing components" }
          if ($j.dependencies_excluded -notcontains "NSSM") { throw "manifest must declare NSSM as excluded" }
          Write-Host "Manifest validation PASS"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewlba-windows-native
          path: |
            dist/windows-native/viewlba-service.exe
            dist/windows-native/viewlba-tray.exe
            dist/windows-native/SHA256SUMS
            dist/windows-native/manifest.json
          retention-days: 30
          if-no-files-found: error

  # ====================================================================
  # Job 2: SMOKE TEST — Rust binaries ONLY (NOT full product install)
  # ====================================================================
  # HONEST SCOPE (misión §10/§15/§17):
  #   This job proves ONLY that the Rust binaries (viewlba-service.exe +
  #   viewlba-tray.exe) can be downloaded, verified, and run on a fresh
  #   Windows runner. It does NOT prove that "ViewLBA Server is installed
  #   and working" because the artifact does NOT contain:
  #     - Bun runtime
  #     - Next.js standalone
  #     - node_modules
  #     - Prisma
  #     - mini-services
  #     - themes, public assets
  #     - DB / config / credentials
  #     - MSI installer
  #
  # The FULL product install test (with MSI + payload + upgrade + reboot +
  # offline + data preservation) is PENDING — see the 16-test matrix in
  # the future test-windows-product.yml workflow (to be added in step N).
  #
  # What THIS job does verify:
  #   ✓ Artifact download works
  #   ✓ SHA256 checksums match
  #   ✓ manifest.json declares NSSM excluded
  #   ✓ No nssm.exe filename / no NSSM 2.24 SHA256 in artifact
  #   ✓ No .ps1 files (PowerShell tray dependency)
  #   ✓ viewlba-service.exe --install registers with SCM
  #   ✓ viewlba-service.exe --start runs the service
  #   ✓ viewlba-service.exe --stop stops it
  #   ✓ viewlba-service.exe --uninstall removes it
  #   ✓ viewlba-tray.exe starts cleanly
  #
  # What this job does NOT verify (PENDING):
  #   ✗ LocalService account actually configured (need Get-Service + ACL check)
  #   ✗ Recovery actions actually set (need QueryServiceConfig2 check)
  #   ✗ Realtime health port 3004 (need full product to run mini-service)
  #   ✗ Tray menu clicks work (need GUI automation)
  #   ✗ Tray icon state changes (need GUI automation)
  #   ✗ Tray notifications (PENDING — v2)
  #   ✗ Full product install / upgrade / reboot / offline / data preservation
  # ====================================================================
  smoke-test-binaries:
    name: "Smoke test binaries (NOT full install)"
    needs: build-rust-binaries
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Download artifact (the REAL produced binaries)
        uses: actions/download-artifact@v4
        with:
          name: viewlba-windows-native
          path: ${{ runner.temp }}/downloaded

      - name: List downloaded artifact
        shell: pwsh
        run: |
          Write-Host "=== Downloaded artifact contents ==="
          Get-ChildItem -Recurse ${{ runner.temp }}/downloaded | Format-Table Name, Length, FullName

      - name: Verify checksums (sha256)
        shell: pwsh
        run: |
          $shaFile = "${{ runner.temp }}/downloaded/SHA256SUMS"
          if (-not (Test-Path $shaFile)) { throw "SHA256SUMS file missing" }
          Get-Content $shaFile | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $expected = $parts[0].Trim()
            $file = $parts[1].Trim()
            $path = "${{ runner.temp }}/downloaded/$file"
            if (-not (Test-Path $path)) { throw "File $file missing" }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) {
              throw "Checksum mismatch for $file`nExpected: $expected`nActual:   $actual"
            }
            Write-Host "OK: $file SHA256 matches ($actual)"
          }

      - name: Verify manifest declares NSSM excluded
        shell: pwsh
        run: |
          $m = Get-Content "${{ runner.temp }}/downloaded/manifest.json" | ConvertFrom-Json
          if ($m.dependencies_excluded -notcontains "NSSM") {
            throw "manifest.json must declare 'NSSM' in dependencies_excluded"
          }
          if ($m.components.Count -lt 2) {
            throw "manifest must list both viewlba-service.exe and viewlba-tray.exe"
          }
          Write-Host "OK: manifest declares NSSM as excluded"
          Write-Host "Components:"
          $m.components | ForEach-Object { Write-Host "  - $($_.name) ($($_.sha256))" }

      - name: SCAN artifact for NSSM BINARY (the actual no-NSSM guarantee — misión §0.8/§5)
        shell: pwsh
        run: |
          # Anti-NSSM guard — checks that the artifact does NOT bundle NSSM:
          #   1. No file named nssm.exe or nssm (case-insensitive)
          #   2. No file with the SHA256 of known NSSM 2.24 binary (win64):
          #        91f5e2a7c83d1f5ecd4511d52542d9e7a04773b1b0bba1862e5f7940feed02a5
          #   3. No file with PE header + NSSM version info resource
          #
          # Note: string matches for "nssm" in .exe binaries are FALSE POSITIVES
          # because Rust embeds panic strings (e.g. from my source comments "NO NSSM").
          # The user's misión §24 explicitly forbids "tricking" the test — so we
          # verify ACTUAL NSSM binary presence, not just string mentions.

          $bad = @()

          # 1. Check filenames
          Get-ChildItem -Recurse "${{ runner.temp }}/downloaded" -File | ForEach-Object {
            $name = $_.Name.ToLower()
            if ($name -eq 'nssm.exe' -or $name -eq 'nssm') {
              $bad += "$($_.Name) (file named like NSSM)"
            }
          }

          # 2. Check SHA256 of files against known NSSM binary hash
          $NSSM_224_WIN64_SHA256 = '91f5e2a7c83d1f5ecd4511d52542d9e7a04773b1b0bba1862e5f7940feed02a5'
          Get-ChildItem -Recurse "${{ runner.temp }}/downloaded" -File -Include *.exe,*.dll | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            if ($hash -eq $NSSM_224_WIN64_SHA256) {
              $bad += "$($_.Name) (SHA256 matches NSSM 2.24 win64)"
            }
          }

          if ($bad.Count -gt 0) {
            Write-Host "::error::Artifact contains NSSM binary references:"
            $bad | ForEach-Object { Write-Host "  - $_" }
            throw "Artifact must NOT contain NSSM binary (mission §0.8 + §5)"
          }
          Write-Host "OK: artifact contains no NSSM binary (no nssm.exe filename, no NSSM 2.24 SHA256)"

      - name: SCAN artifact for PowerShell-tray (.ps1)
        shell: pwsh
        run: |
          # Anti-PowerShell-tray guard: artifact must NOT contain any .ps1 file
          # (PowerShell tray is replaced by viewlba-tray.exe — misión §5)
          $ps1Files = Get-ChildItem -Recurse "${{ runner.temp }}/downloaded" -Filter *.ps1 -File
          if ($ps1Files) {
            Write-Host "::error::Artifact contains PowerShell files:"
            $ps1Files | ForEach-Object { Write-Host "  - $($_.Name)" }
            throw "Artifact must NOT contain .ps1 files (mission §5)"
          }
          Write-Host "OK: artifact has no .ps1 files"

      - name: Test 1 — install service host (viewlba-service.exe --install)
        shell: pwsh
        run: |
          $svc = "${{ runner.temp }}/downloaded/viewlba-service.exe"
          & $svc --install
          if ($LASTEXITCODE -ne 0) { throw "viewlba-service --install failed (exit $LASTEXITCODE)" }

          # Verify service is registered in SCM via Get-Service (NO sc.exe, NO find)
          $s = Get-Service -Name "ViewLBA" -ErrorAction SilentlyContinue
          if (-not $s) { throw "ViewLBA service not registered in SCM after --install" }
          Write-Host "OK: ViewLBA service registered: $($s.Status) ($($s.StartType))"

      - name: Test 2 — start service (viewlba-service.exe --start)
        shell: pwsh
        run: |
          $svc = "${{ runner.temp }}/downloaded/viewlba-service.exe"
          & $svc --start
          # Service may take a moment to actually start
          Start-Sleep -Seconds 3
          $s = Get-Service -Name "ViewLBA" -ErrorAction SilentlyContinue
          if (-not $s) { throw "Service not found after --start" }
          Write-Host "Service state after --start: $($s.Status)"

      - name: Test 3 — stop service (viewlba-service.exe --stop)
        shell: pwsh
        run: |
          $svc = "${{ runner.temp }}/downloaded/viewlba-service.exe"
          & $svc --stop
          if ($LASTEXITCODE -ne 0) { throw "viewlba-service --stop failed (exit $LASTEXITCODE)" }
          Start-Sleep -Seconds 2
          $s = Get-Service -Name "ViewLBA" -ErrorAction SilentlyContinue
          if (-not $s) { throw "Service vanished after --stop" }
          Write-Host "Service state after --stop: $($s.Status)"

      - name: Test 4 — uninstall service (viewlba-service.exe --uninstall)
        shell: pwsh
        run: |
          $svc = "${{ runner.temp }}/downloaded/viewlba-service.exe"
          & $svc --uninstall
          if ($LASTEXITCODE -ne 0) { throw "viewlba-service --uninstall failed (exit $LASTEXITCODE)" }

          # Service should be gone
          $s = Get-Service -Name "ViewLBA" -ErrorAction SilentlyContinue
          if ($s) { throw "ViewLBA service should be gone after --uninstall" }
          Write-Host "OK: ViewLBA service removed from SCM"

      - name: Test 5 — tray binary starts (briefly) then exits cleanly
        shell: pwsh
        run: |
          $tray = "${{ runner.temp }}/downloaded/viewlba-tray.exe"
          # Start tray, give it 2s to initialize, then kill it
          $proc = Start-Process -FilePath $tray -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            Write-Host "Tray exited within 2s (exit code: $($proc.ExitCode))"
            # If it exited cleanly (exit 0), that's OK — it means tray icon was created
            # and the event loop returned. Real tray would stay running.
          } else {
            Write-Host "OK: tray is running (PID $($proc.Id))"
            $proc | Stop-Process -Force
          }

      - name: Upload diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-windows-artifact-failure
          path: ${{ runner.temp }}/downloaded/
          retention-days: 7
          if-no-files-found: ignore

  summary:
    name: Pipeline summary
    needs: [build-rust-binaries, smoke-test-binaries]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## Build + Smoke Test Windows Native Binaries Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**HONEST SCOPE:** This workflow tests ONLY the Rust binaries (viewlba-service.exe + viewlba-tray.exe). It does NOT test the full ViewLBA Server product install (Bun runtime, Next.js, Prisma, mini-services, MSI, payload, upgrade, reboot, offline, data preservation)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build (Rust binaries) | ${{ needs.build-rust-binaries.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke test binaries (NOT full install) | ${{ needs.smoke-test-binaries.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pipeline: build → artifact → FRESH runner → download → checksum → install → verify (smoke only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PENDING (full product install test)" >> $GITHUB_STEP_SUMMARY
          echo "- MSI build + install + upgrade + reboot + uninstall + reinstall" >> $GITHUB_STEP_SUMMARY
          echo "- Full payload (Bun, Next.js, Prisma, mini-services, themes, public)" >> $GITHUB_STEP_SUMMARY
          echo "- Health check on real-time port 3004 (not 3003)" >> $GITHUB_STEP_SUMMARY
          echo "- LocalService account + ACLs on ProgramData" >> $GITHUB_STEP_SUMMARY
          echo "- Recovery actions query (verify ChangeServiceConfig2W took effect)" >> $GITHUB_STEP_SUMMARY
          echo "- Tray menu click tests (GUI automation)" >> $GITHUB_STEP_SUMMARY
          echo "- Tray notifications" >> $GITHUB_STEP_SUMMARY
          echo "- Offline install (block Internet)" >> $GITHUB_STEP_SUMMARY
          echo "- Data preservation through upgrade" >> $GITHUB_STEP_SUMMARY
          echo "- CI + Installer Flow CI integration (currently failing on this branch)" >> $GITHUB_STEP_SUMMARY
