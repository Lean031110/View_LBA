# ViewLBA — Generador de licencias vía GitHub Actions (sección 24 del diseño)
#
# Workflow SEPARADO del CI: emite una licencia firmada desde los inputs del
# formulario (workflow_dispatch) y la publica como artifact descargable.
#
# ⚠ SEGURIDAD:
#   · La clave privada viene EXCLUSIVAMENTE del secret
#     VIEWLBA_LICENSE_PRIVATE_KEY (jamás del repo ni de logs).
#   · GitHub enmascara automáticamente los secrets en los logs; ADEMÁS este
#     workflow NUNCA imprime la clave (ni `echo "$KEY"` ni `env | grep`).
#   · El artifact contiene SOLO license.json + README.txt (nada de claves).
#
# Uso: Actions → "License Generator" → Run workflow → completar inputs.

name: License Generator

on:
  workflow_dispatch:
    inputs:
      customerName:
        description: "Nombre del cliente (ej. Leandro Bueno)"
        required: true
        type: string
      installationId:
        description: "Installation ID del cliente (VWLB-XXXX-XXXX-XXXX-XXXX)"
        required: true
        type: string
      diskId:
        description: "Disk ID del cliente (DSK-XXXX-XXXX-XXXX)"
        required: true
        type: string
      installPath:
        description: "Ruta de instalación (ej. C:\\PantallaRestaurante)"
        required: true
        default: "C:\\PantallaRestaurante"
        type: string
      plan:
        description: "Plan contratado"
        required: true
        type: choice
        default: monthly
        options:
          - monthly
          - annual
      startDate:
        description: "Inicio de vigencia (YYYY-MM-DD)"
        required: true
        default: ""
        type: string

concurrency:
  group: license-generator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    name: Emitir licencia (Ed25519)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun (versión exacta)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Instalar dependencias (reproducible)
        # El generador reutiliza src/lib/licensing (zod etc.)
        run: bun install --frozen-lockfile

      - name: Generar Prisma Client
        run: bunx prisma generate

      - name: Verificar que el secret de firma existe
        # FALLA CLARAMENTE si falta el secret — sin clave no se emite nada.
        run: |
          if [ -z "${{ secrets.VIEWLBA_LICENSE_PRIVATE_KEY }}" ]; then
            echo "::error::Falta el secret VIEWLBA_LICENSE_PRIVATE_KEY (Settings → Secrets → Actions). Sin él no se puede firmar licencias."
            exit 1
          fi
          echo "✓ Secret de firma presente (el valor NUNCA se imprime)"

      - name: "Validar fecha de inicio (default: hoy)"
        id: dates
        run: |
          START="${{ github.event.inputs.startDate }}"
          if [ -z "$START" ]; then START="$(date -u +%F)"; fi
          if ! [[ "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::startDate inválido: usa YYYY-MM-DD (recibido: $START)"
            exit 1
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"

      - name: Generar licencia firmada
        env:
          # El secret llega SOLO al proceso del generador. GitHub lo enmascara
          # en cualquier salida accidental; el CLI no lo imprime.
          VIEWLBA_LICENSE_PRIVATE_KEY: ${{ secrets.VIEWLBA_LICENSE_PRIVATE_KEY }}
        run: |
          bun tools/license-generator/cli.ts generate \
            --customer "${{ github.event.inputs.customerName }}" \
            --installation-id "${{ github.event.inputs.installationId }}" \
            --disk-id "${{ github.event.inputs.diskId }}" \
            --install-path "${{ github.event.inputs.installPath }}" \
            --plan "${{ github.event.inputs.plan }}" \
            --start "${{ steps.dates.outputs.start }}" \
            --out-dir "$GITHUB_WORKSPACE/out" \
            --force

      - name: Verificar el ZIP generado (firma + estructura, sin claves)
        env:
          VIEWLBA_LICENSE_PRIVATE_KEY: ${{ secrets.VIEWLBA_LICENSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ZIP="$(ls out/ViewLBA-License-*.zip | head -1)"
          test -n "$ZIP" || { echo "::error::No se generó el ZIP"; exit 1; }
          bun tools/license-generator/cli.ts verify --file "$ZIP"
          # El artifact jamás contiene la clave privada:
          if grep -q "$(printf '%s' "$VIEWLBA_LICENSE_PRIVATE_KEY" | head -c 20)" "$ZIP" 2>/dev/null; then
            echo "::error::El ZIP contiene material de clave — ABORTADO"
            exit 1
          fi
          echo "✓ ZIP verificado: $ZIP"

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.customerName }} license
          path: out/ViewLBA-License-*.zip
          retention-days: 14
          if-no-files-found: error

      - name: Resumen (sin secretos)
        run: |
          {
            echo "### Licencia emitida"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Cliente | ${{ github.event.inputs.customerName }} |"
            echo "| Plan | ${{ github.event.inputs.plan }} |"
            echo "| Inicio | ${{ steps.dates.outputs.start }} |"
            echo "| Installation ID | \`${{ github.event.inputs.installationId }}\` |"
            echo "| Disk ID | \`${{ github.event.inputs.diskId }}\` |"
            echo ""
            echo "Descarga el ZIP desde el artifact de este run y entrégalo al cliente."
            echo "Contacto soporte: 52973387"
          } >> "$GITHUB_STEP_SUMMARY"
