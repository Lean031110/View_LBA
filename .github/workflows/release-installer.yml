name: Release Installers

# ============================================================================
# Build + Release de los instaladores oficiales de ViewLBA Server.
#
# v3.2 — INSTALADORES NATIVOS Y SIMPLES (feedback real del usuario):
#   · Windows: Setup.exe con NSIS puro (sin Tauri, sin Rust). Instala TODO
#     (el runtime bun va DENTRO del paquete: no hace falta node ni bun),
#     registra y ARRANCA el servicio (NSSM incluido), crea accesos en el
#     escritorio y una bandeja con clic derecho Iniciar/Detener.
#   · Linux: .deb con dpkg-deb puro (sin Tauri). Instala TODO (runtime bun
#     incluido), registra y ARRANCA el servicio systemd, credenciales
#     generadas en la máquina, accesos en el escritorio/menú.
#   · VERIFICACIÓN REAL: el .deb se INSTALA en el runner (systemd activo +
#     /api/health 200 + start/stop + purge) y el Setup.exe se instala en
#     silencioso en el runner de Windows (servicio + health + desinstalar).
#     Nada se publica sin esa evidencia.
#
# Arquitectura (4 jobs):
#   build-linux   → payload (bundle-server + smoke REAL) → .deb → VALIDACIÓN
#                   REAL (dpkg -i) → AppImage CLI → artefactos
#   build-windows → payload (mismos guards) → Setup.exe NSIS → VALIDACIÓN
#                   REAL (/S + servicio + health + uninstall) → artefactos
#   build-android → APK firmado (action compuesto android-apk)
#   release       → NO recompila NADA: descarga artefactos ya validados,
#                   gitleaks, SHA256SUMS.txt y publica el GitHub Release.
#
# REPRODUCIBILIDAD (versiones EXACTAS — nunca "latest"):
#   · Bun del build:        1.4.2     (oven-sh/setup-bun, input soportado)
#   · Bun del payload:      1.3.14    (runtime DISTRIBUIDO dentro del paquete)
#   · NSSM:                 2.24      (incluido en el payload de Windows)
#
# EL PAYLOAD ES DE PRODUCCIÓN (BUILD deps ≠ RUNTIME deps): ~450 MB. Los
# guards de installer/package/payload.ts fallan ANTES de empaquetar.
# Offline: la red se usa SOLO durante el build. El instalador final
# funciona sin Internet.
# ============================================================================

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versiones EXACTAS (determinismo — ver cabecera).
  BUILD_BUN: "1.4.2"
  PAYLOAD_BUN: "1.3.14"

jobs:
  # ------------------------------------------------------------------ Linux
  build-linux:
    name: "Linux: payload + .deb nativo + AppImage CLI (validación REAL)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Bun (versión exacta)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUILD_BUN }}

      - name: Dependencias del repo (entorno de build — PODADO en el payload)
        run: bun install --frozen-lockfile

      - name: Dependencias de mini-services (entorno de build)
        run: |
          (cd mini-services/realtime-service && bun install --frozen-lockfile)
          (cd mini-services/stream-service && bun install --frozen-lockfile)

      - name: Prisma Client (entorno de build)
        run: bunx prisma generate

      - name: Tests del installer (lógica verificada ANTES de empaquetar)
        run: bun test tests/installer/

      - name: Versión de release (del tag o del package.json)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(bun -e 'console.log(require("./package.json").version)'); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "→ versión: $V"

      - name: "Payload de producción (bundle-server: createProductionPayload + guards)"
        run: bun installer/package/bundle-server.ts --platform=linux --version="$VERSION" --bun-version="${PAYLOAD_BUN}"

      # SMOKE REAL (§ contrato): el payload debe EJECUTARSE antes de empaquetar.
      - name: Smoke del payload (migrate + arranque + health + mini-services + SIGTERM)
        run: bash installer/package/smoke-payload.sh dist/release/linux/ViewLBA-Server

      # ------------------------------------------------ .deb NATIVO (dpkg-deb)
      # Sin Tauri, sin Rust, sin linuxdeploy: un .deb clásico que instala el
      # servicio systemd, genera credenciales y crea los accesos directos.
      - name: "Construir .deb nativo (dpkg-deb: payload + postinst + shortcuts)"
        run: bun installer/linux/build-deb.ts --staging=dist/release/linux/ViewLBA-Server --version="$VERSION" --out=dist/release/linux/out

      # VALIDACIÓN REAL: instalar el .deb EN ESTE RUNNER (systemd presente) y
      # demostrar que el servidor queda EN EJECUCIÓN con health 200. Nada de
      # «estructura correcta»: instalación de verdad, como la del usuario.
      - name: "VALIDACIÓN REAL: dpkg -i → servicio activo + health + start/stop + purge"
        timeout-minutes: 10
        run: |
          set -euo pipefail
          DEB="dist/release/linux/out/ViewLBA-Server-$VERSION-x86_64.deb"
          test -s "$DEB" || { echo "✗ falta el .deb"; exit 1; }

          echo "→ instalando el .deb (postinst: systemd + DB + admin + arranque)…"
          # Si el postinst falla, el diagnóstico del instalador ya salió por
          # consola — pero el PORQUÉ del servicio lo tiene journald: volcarlo
          # ANTES de morir (lección del quinto build: health unreachable sin
          # poder ver el crash del servicio no es depurable).
          if ! sudo dpkg -i "$DEB"; then
            echo ""
            echo "═══ dpkg -i FALLÓ — journald de los servicios ═══"
            sudo journalctl -u pantalla-restaurante.service --no-pager -n 60 2>&1 || true
            echo "─── estado ───"
            systemctl status pantalla-restaurante.service --no-pager -l 2>&1 | head -20 || true
            sudo ls -la /opt/pantalla-restaurante/runtime /opt/pantalla-restaurante/.next/standalone 2>&1 | head -12 || true
            sudo cat /etc/pantalla-restaurante.env 2>/dev/null | grep -v SECRET | grep -v TOKEN || true
            echo "─── logs estructurados (/var/log/pantalla-restaurante) ───"
            sudo ls -la /var/log/pantalla-restaurante 2>&1 || true
            sudo tail -30 /var/log/pantalla-restaurante/*.log 2>/dev/null || true
            exit 1
          fi

          echo "→ servicio activo:"
          systemctl is-active pantalla-restaurante.service
          systemctl is-enabled pantalla-restaurante.target

          echo "→ health (hasta 120 s — primer arranque + migraciones):"
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /tmp/health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          [[ -n "$ok" ]] || { echo "✗ /api/health sin respuesta"; sudo viewlba-server logs || true; exit 1; }
          cat /tmp/health.json; echo

          echo "→ credenciales + accesos:"
          sudo test -s /opt/viewlba-server/CREDENCIALES.txt
          test -f /usr/share/applications/viewlba-panel.desktop
          test -f /usr/share/applications/viewlba-start.desktop
          test -x /usr/bin/viewlba-server
          sudo viewlba-server status | grep -E "pantalla-restaurante" | head -3

          echo "→ ciclo stop/start (los botones del usuario):"
          sudo viewlba-server stop   || true
          sleep 2
          systemctl is-active pantalla-restaurante.service || true  # puede quedar activando/apagando
          for i in $(seq 1 15); do
            st=$(systemctl is-active pantalla-restaurante.service || true)
            [[ "$st" == "inactive" || "$st" == "failed" ]] && break
            sleep 2
          done
          sudo viewlba-server start
          for i in $(seq 1 30); do
            systemctl is-active --quiet pantalla-restaurante.service && break
            sleep 2
          done
          systemctl is-active pantalla-restaurante.service
          echo "✓ ciclo stop/start correcto"

          echo "→ purge (desinstalación completa):"
          sudo dpkg --purge viewlba-server > /dev/null 2>&1 || sudo dpkg --purge viewlba-server
          # tras purge, los servicios deben desaparecer
          if systemctl list-unit-files | grep -q "^pantalla-restaurante"; then
            echo "::warning::unidades residuales tras purge"
          fi
          sudo rm -rf /var/lib/pantalla-restaurante /opt/pantalla-restaurante 2>/dev/null || true
          echo "✓ .deb VALIDADO en un Linux real (instalación + servicio + health + control + purge)"

      - name: "Liberar disco (entorno de build fuera — el .deb ya está validado)"
        run: |
          rm -rf node_modules .next mini-services/realtime-service/node_modules mini-services/stream-service/node_modules
          rm -rf /tmp/viewlba-bundle /tmp/viewlba-smoke-* /tmp/pre.txt
          df -h / | tail -1

      # ---- CLI AppImage (headless — appimagetool directo, sin linuxdeploy) ----
      - name: AppImage CLI (headless, appimagetool directo)
        run: bash installer/package/appimage.sh dist/release/linux/ViewLBA-Server

      - name: Verificación REAL del AppImage CLI (arranca el installer)
        timeout-minutes: 5
        run: |
          set -e
          IMG=dist/release/linux/ViewLBA-Server-CLI.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 "$IMG" --cli --json detect | head -c 200
          echo
          APPIMAGE_EXTRACT_AND_RUN=1 "$IMG" --cli preflight < /dev/null | tee /tmp/pre.txt
          grep -q "systemd" /tmp/pre.txt || echo "::warning::preflight sin menciones de systemd"

      # ---- Validación final de artefactos (§14) ----
      - name: "Validar artefactos finales (.deb + CLI AppImage + nombres)"
        run: |
          set -euo pipefail
          OUT=dist/release/linux/out
          DEB_OUT="$OUT/ViewLBA-Server-$VERSION-x86_64.deb"
          test -s "$DEB_OUT" || { echo "✗ .deb vacío o ausente"; exit 1; }
          dpkg-deb --info "$DEB_OUT" > /tmp/deb-info.txt
          dpkg-deb --contents "$DEB_OUT" > /tmp/deb-contents.txt
          grep -q "Package: viewlba-server" /tmp/deb-info.txt
          grep -q "opt/viewlba-server/viewlba-installer" /tmp/deb-contents.txt \
            || { echo "✗ el .deb NO contiene el sidecar del installer"; exit 1; }
          grep -q "opt/viewlba-server/runtime/bun" /tmp/deb-contents.txt \
            || { echo "✗ el .deb NO contiene el runtime bun (autosuficiencia)"; exit 1; }
          grep -q "usr/share/applications/viewlba-panel.desktop" /tmp/deb-contents.txt \
            || { echo "✗ el .deb NO crea accesos directos"; exit 1; }
          # ⚠ dpkg-deb --contents lista SOLO el archivo data: DEBIAN/postinst
          # NO aparece ahí (bug del 9.º build: grep silencioso → set -e mataba
          # el paso sin mensaje). El control se valida extrayéndolo.
          dpkg-deb --control "$DEB_OUT" /tmp/deb-ctl
          test -s /tmp/deb-ctl/postinst || { echo "✗ falta DEBIAN/postinst"; exit 1; }
          echo "✓ .deb validado (dpkg-deb --info/--contents): $(du -h "$DEB_OUT" | cut -f1)"
          CLI_OUT="$OUT/ViewLBA-Server-CLI-$VERSION-x86_64.AppImage"
          test -s dist/release/linux/ViewLBA-Server-CLI.AppImage || { echo "✗ falta el AppImage CLI"; exit 1; }
          cp dist/release/linux/ViewLBA-Server-CLI.AppImage "$CLI_OUT"
          ls -la "$OUT/"

      - name: Manifiest del build (commit ↔ binario)
        run: |
          bun installer/package/build-manifest.ts \
            --staging=dist/release/linux/ViewLBA-Server \
            --artifact="dist/release/linux/out/ViewLBA-Server-$VERSION-x86_64.deb" \
            --out=dist/release/linux/out/manifest-linux.json

      - name: SHA256SUMS (Linux — nombres públicos finales)
        run: |
          cd dist/release/linux/out
          rm -f SHA256SUMS.txt && sha256sum -- *.deb *.AppImage manifest-linux.json > SHA256SUMS.txt
          sha256sum "ViewLBA-Server-CLI-$VERSION-x86_64.AppImage" > "ViewLBA-Server-CLI-$VERSION-x86_64.AppImage.sha256"
          cat SHA256SUMS.txt

      - name: Subir artefactos (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: viewlba-linux-installer
          path: dist/release/linux/out/*
          retention-days: 3
          # §14: verde SOLO si hay instalador
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  build-windows:
    name: "Windows: payload + Setup.exe NSIS (validación REAL)"
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Bun (versión exacta)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUILD_BUN }}

      - name: Dependencias del repo (entorno de build)
        run: bun install --frozen-lockfile

      - name: Dependencias de mini-services (entorno de build)
        shell: bash
        run: |
          (cd mini-services/realtime-service && bun install --frozen-lockfile)
          (cd mini-services/stream-service && bun install --frozen-lockfile)

      - name: Prisma Client (entorno de build — engines de WINDOWS)
        run: bunx prisma generate

      - name: Versión de release (del tag o del package.json)
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(bun -e 'console.log(require("./package.json").version)'); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: "Payload de producción (bundle-server: createProductionPayload + guards)"
        shell: bash
        run: bun installer/package/bundle-server.ts --platform=windows --version="$VERSION" --bun-version="${PAYLOAD_BUN}"

      # Smoke estructural Windows (§17): contrato completo del payload.
      - name: "Smoke del payload (contrato Windows: entrypoint + engines + sidecars + 0 symlinks)"
        shell: bash
        run: |
          set -euo pipefail
          STAGE=dist/release/windows/ViewLBA-Server
          SRV="$STAGE/resources/server"
          test -f "$SRV/.next/standalone/server.js"      || { echo "✗ falta server.js"; exit 1; }
          test -f "$SRV/scripts/start.ts"                || { echo "✗ falta scripts/start.ts"; exit 1; }
          test -d "$SRV/node_modules/@prisma/engines"    || { echo "✗ faltan engines de Prisma"; exit 1; }
          ls "$SRV/node_modules/@prisma/engines" | grep -qi "engine" || { echo "✗ sin binarios de engine"; exit 1; }
          test -d "$SRV/node_modules/.prisma/client"     || { echo "✗ falta Prisma Client generado"; exit 1; }
          test -x "$STAGE/runtime/bun.exe"               || { echo "✗ falta runtime/bun.exe"; exit 1; }
          test -f "$STAGE/runtime/nssm.exe"              || { echo "✗ falta runtime/nssm.exe"; exit 1; }
          test -x "$STAGE/viewlba-installer.exe"         || { echo "✗ falta el sidecar"; exit 1; }
          LINKS=$(find "$SRV" -type l | wc -l)
          [[ "$LINKS" -eq 0 ]] || { echo "✗ $LINKS symlink(s) en el payload (NSIS no puede empaquetarlos)"; find "$SRV" -type l; exit 1; }
          echo "✓ contrato Windows OK: entrypoint + engines + sidecars + 0 symlinks"

      - name: Smoke del sidecar (detect en Windows REAL)
        shell: bash
        timeout-minutes: 3
        run: |
          ./dist/release/windows/ViewLBA-Server/viewlba-installer.exe --json detect | head -c 200
          echo

      # ------------------------------------------------ Setup.exe (NSIS puro)
      # NSIS viene preinstalado en los runners de Windows (C:\Program Files
      # (x86)\NSIS\makensis.exe); fallback a chocolatey por si cambia la imagen.
      - name: "Localizar makensis (NSIS 3 — preinstalado en el runner)"
        shell: pwsh
        run: |
          $cand = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) + (@($env:PATH -split ';' | ForEach-Object { Join-Path $_ 'makensis.exe' }))
          $nsis = $cand | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            Write-Host "makensis no encontrado — instalando via chocolatey…"
            choco install -y nsis | Out-Null
            $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          Write-Host "makensis: $nsis"
          if (-not (Test-Path $nsis)) { throw "makensis no disponible" }
          Add-Content $env:GITHUB_ENV "MAKENSIS=$nsis"

      - name: "Construir Setup.exe (NSIS: payload + servicio + bandeja + accesos)"
        shell: pwsh
        run: |
          $out = "dist/release/windows/out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Rutas ABSOLUTAS para TODO lo que referencia File/OutFile:
          # makensis resuelve las relativas contra el CWD DE LA LLAMADA
          # (lección del primer build real: File "tray/…" y ${ICON} fallaron
          # con CWD=raíz del repo — ver nota actualizada en el .nsi).
          $payload = (Resolve-Path "dist/release/windows/ViewLBA-Server").Path
          $tray    = (Resolve-Path "installer/windows/tray/ViewLBA-Tray.ps1").Path
          $icon    = (Resolve-Path "installer/windows/viewlba.ico").Path
          $outExe = "$PWD/dist/release/windows/out/ViewLBA-Server-Setup-$env:VERSION.exe"
          $log = & $env:MAKENSIS `
            "-DVERSION=$env:VERSION" `
            "-DPAYLOAD=$payload" `
            "-DTRAY_PS1=$tray" `
            "-DICON=$icon" `
            "-DOUT_EXE=$outExe" `
            "installer/windows/viewlba-setup.nsi" 2>&1
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "makensis falló ($LASTEXITCODE)" }
          $exe = "$out/ViewLBA-Server-Setup-$env:VERSION.exe"
          if (-not (Test-Path $exe)) { throw "no se produjo $exe" }
          Write-Host "✓ Setup.exe: $((Get-Item $exe).Length / 1MB) MB"

      # VALIDACIÓN REAL: instalar el Setup.exe EN ESTE RUNNER de Windows, en
      # silencioso (/S), y demostrar que el servicio queda corriendo con
      # /api/health 200. Igual que lo hará el usuario (doble clic → listo).
      - name: "VALIDACIÓN REAL: Setup.exe /S → servicio + health + net stop/start + uninstall"
        shell: pwsh
        timeout-minutes: 15
        run: |
          $exe = "dist/release/windows/out/ViewLBA-Server-Setup-$env:VERSION.exe"
          if (-not (Test-Path $exe)) { throw "falta el Setup.exe" }

          Write-Host "→ instalación silenciosa (como el usuario, sin preguntas)…"
          # -Verb RunAs: los pasos del runner corren con token FILTRADO
          # (integridad media): sin elevación explícita el instalador muere
          # en el preflight «Permisos de administrador: NO». Los runners
          # de Windows auto-aprueban la elevación (ConsentPromptBehaviorAdmin=0).
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -Wait -PassThru -Verb RunAs
          if ($p.ExitCode -ne 0) {
            Write-Host "→ la instalación silenciosa falló (código $($p.ExitCode)). Diagnóstico:"
            # El instalador dejó SU salida en install.log (redirección del NSIS)
            if (Test-Path "C:\ViewLBA\install.log") {
              Write-Host "--- install.log (salida REAL del instalador durante el /S) ---"
              Get-Content "C:\ViewLBA\install.log" | Select-Object -First 60 | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host "  (sin install.log — el instalador ni siquiera llegó a ejecutarse)"
            }
            if (Test-Path "C:\ViewLBA\viewlba-installer.exe") {
              Write-Host "--- viewlba-installer --config (re-ejecución visible, token del paso) ---"
              & C:\ViewLBA\viewlba-installer.exe --config C:\ViewLBA\install-config.json 2>&1 | Select-Object -First 30 | ForEach-Object { Write-Host "  $_" }
            }
            throw "la instalación silenciosa falló (código $($p.ExitCode))"
          }

          Write-Host "→ servicio registrado y corriendo:"
          $svc = Get-Service -Name PantallaRestaurante -ErrorAction SilentlyContinue
          if (-not $svc) { throw "el servicio PantallaRestaurante NO existe" }
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            $svc = Get-Service PantallaRestaurante
            if ($svc.Status -eq 'Running') { break }
            Start-Sleep 3
          }
          if ((Get-Service PantallaRestaurante).Status -ne 'Running') {
            Write-Host "estado: $((Get-Service PantallaRestaurante).Status)"
            C:\ViewLBA\viewlba-installer.exe diagnostics 2>&1 | Write-Host
            throw "el servicio no quedó Running"
          }
          Write-Host "✓ PantallaRestaurante: Running"

          Write-Host "→ health (hasta 180 s — primer arranque):"
          $ok = $false
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:3000/api/health" -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep 3 }
          }
          if (-not $ok) {
            C:\ViewLBA\viewlba-installer.exe logs 2>&1 | Write-Host
            throw "/api/health sin respuesta"
          }
          Write-Host "✓ /api/health 200"

          Write-Host "→ credenciales, accesos y bandeja:"
          foreach ($f in @("C:\ViewLBA\CREDENCIALES.txt", "C:\ViewLBA\viewlba.ico", "C:\ViewLBA\tray\ViewLBA-Tray.ps1")) {
            if (-not (Test-Path $f)) { throw "falta $f" }
          }
          $desk = [Environment]::GetFolderPath('Desktop')
          $sh = New-Object -ComObject WScript.Shell
          foreach ($n in @("ViewLBA - Panel", "ViewLBA - Iniciar servidor", "ViewLBA - Detener servidor", "ViewLBA - Credenciales", "ViewLBA - Bandeja")) {
            if (-not (Test-Path "$desk\$n.lnk")) { throw "falta el acceso directo: $desk\$n.lnk" }
          }
          # el tray-script compila (sintaxis PowerShell) sin errores
          $err = powershell.exe -NoProfile -Command "try { [void][System.Management.Automation.Language.Parser]::ParseFile('C:\ViewLBA\tray\ViewLBA-Tray.ps1', [ref]$null, [ref]\$e); if (\$e) { exit 1 } } catch { exit 1 }; exit 0"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::el parser reportó problemas en ViewLBA-Tray.ps1" }

          Write-Host "→ ciclo stop/start (los botones del usuario):"
          net stop PantallaRestaurante | Write-Host
          Start-Sleep 2
          if ((Get-Service PantallaRestaurante).Status -ne 'Stopped') { throw "no se detuvo" }
          net start PantallaRestaurante | Write-Host
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and (Get-Service PantallaRestaurante).Status -ne 'Running') { Start-Sleep 2 }
          if ((Get-Service PantallaRestaurante).Status -ne 'Running') { throw "no arrancó de nuevo" }
          Write-Host "✓ stop/start correcto"

          Write-Host "→ desinstalación (conserva datos, quita servicio + accesos):"
          $u = Start-Process -FilePath "C:\ViewLBA\uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "el desinstalador falló ($($u.ExitCode))" }
          if (Get-Service PantallaRestaurante -ErrorAction SilentlyContinue) { throw "el servicio sigue existiendo tras desinstalar" }
          $desk = [Environment]::GetFolderPath('Desktop')
          if (Test-Path "$desk\ViewLBA - Panel.lnk") { Write-Host "::warning::acceso residual en el escritorio" }
          Write-Host "✓ Setup.exe VALIDADO en un Windows real (servicio + health + control + uninstall)"

      - name: "Liberar disco (entorno de build fuera)"
        shell: bash
        run: |
          rm -rf node_modules .next mini-services/realtime-service/node_modules mini-services/stream-service/node_modules
          df -h / | tail -1 || true

      - name: "Validar y renombrar artefacto (PE/MZ, >0 bytes)"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release/windows/out
          EXE_OUT="dist/release/windows/out/ViewLBA-Server-Setup-$VERSION.exe"
          test -s "$EXE_OUT" || { echo "✗ Setup.exe vacío o ausente"; exit 1; }
          head -c 2 "$EXE_OUT" | grep -q "MZ" || { echo "✗ no es un PE válido (falta MZ)"; exit 1; }
          echo "✓ Setup.exe validado (PE/MZ, >0 bytes): $(du -h "$EXE_OUT" | cut -f1)"

      - name: Manifiest del build (commit ↔ binario)
        shell: bash
        run: |
          bun installer/package/build-manifest.ts \
            --staging=dist/release/windows/ViewLBA-Server \
            --artifact="dist/release/windows/out/ViewLBA-Server-Setup-$VERSION.exe" \
            --out=dist/release/windows/out/manifest-windows.json

      - name: SHA256SUMS (Windows)
        shell: bash
        run: |
          cd dist/release/windows/out
          rm -f SHA256SUMS.txt && sha256sum -- *.exe manifest-windows.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Subir artefactos (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: viewlba-windows-installer
          path: dist/release/windows/out/*
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  # APK del generador — MISMO pipeline compuesto que el CI de la app
  # (.github/actions/android-apk): lint, tests, build, zipalign, apksigner
  # v1+v2+v3, verify, badging, unzip -t, análisis, branding, checksum.
  # El APK llega al GitHub Release SOLO pasando la verificación cripto.
  build-android:
    name: "Android: APK firmado + verificado (apksigner v1+v2+v3)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: "Versión de release (tag con gate contra /VERSION)"
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
            FV=$(cat VERSION)
            # Tag FINAL (sin sufijo -rc/-beta): debe coincidir EXACTAMENTE
            # con la única fuente de verdad del repo.
            if [[ "$V" != *"-"* && "$V" != "$FV" ]]; then
              echo "::error::tag v$V ≠ /VERSION ($FV) — sincroniza VERSION antes del tag final"
              exit 1
            fi
          else
            V=$(cat VERSION)
          fi
          echo "APK_VERSION=$V" >> "$GITHUB_ENV"
          echo "→ versión Android: $V"

      - name: "APK firmado y verificado (action compuesto)"
        uses: ./.github/actions/android-apk
        env:
          KEYSTORE_BASE64: ${{ secrets.VIEWLBA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIEWLBA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIEWLBA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIEWLBA_KEY_PASSWORD }}
        with:
          version-name: ${{ env.APK_VERSION }}
          artifact-name: viewlba-license-generator-release

  # ---------------------------------------------------------------- Release
  # NO recompila: consume ÚNICAMENTE artefactos ya validados por los builds.
  release:
    name: "GitHub Release (gitleaks + SHA256SUMS + publicación)"
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (para gitleaks — historial completo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks (verificación de secretos ANTES de publicar)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v3.1 §28: el Manual de Usuario (PDF) se genera desde EL MISMO commit
      # del tag — mismo script determinista del workflow customer-manual.yml.
      - name: Python para el Manual de Usuario
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Manual de Usuario (construir + validar §29)"
        run: |
          set -euo pipefail
          pip install "reportlab==4.4.9" "pillow==11.3.0"
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 scripts/build_customer_manual.py
          PDF=$(find dist/manual -name "ViewLBA-Manual-Usuario-v*.pdf" | head -1)
          test -n "$PDF"
          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          [[ "$PAGES" -gt 0 ]] || { echo "✗ el manual no tiene páginas"; exit 1; }
          pdftotext "$PDF" manual.txt
          for REQUIRED in "ViewLBA" "7 días" "10 USD" "100 USD" "52973387" "Activar" "Licencia" "Temas"; do
            grep -qF "$REQUIRED" manual.txt || { echo "::error::falta '$REQUIRED' en el manual"; exit 1; }
          done
          echo "✓ Manual de Usuario validado ($PAGES páginas, textos §29 presentes)"

      - name: Descargar artefactos validados
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: "Validar el conjunto completo (§14: faltan piezas ⇒ NO publicar)"
        run: |
          set -euo pipefail
          EXE=$(find artifacts -name "ViewLBA-Server-Setup-*.exe" | head -1)
          DEB=$(find artifacts -name "ViewLBA-Server-*-x86_64.deb" | head -1)
          CLI=$(find artifacts -name "ViewLBA-Server-CLI-*-x86_64.AppImage" | head -1)
          APK=$(find artifacts -name "ViewLBA-License-Generator-v*.apk" | head -1)
          APKSUMS=$(find artifacts -name "LicenseGenerator-SHA256SUMS.txt" | head -1)
          APKVERIFY=$(find artifacts -name "LicenseGenerator-VERIFY.txt" | head -1)
          [[ -n "$EXE" && -s "$EXE" ]] || { echo "✗ falta el Setup.exe"; exit 1; }
          [[ -n "$DEB" && -s "$DEB" ]] || { echo "✗ falta el .deb"; exit 1; }
          [[ -n "$CLI" && -s "$CLI" ]] || { echo "✗ falta el AppImage CLI"; exit 1; }
          [[ -n "$APK" && -s "$APK" ]] || { echo "✗ falta el APK firmado del generador"; exit 1; }
          [[ -n "$APKSUMS" && -s "$APKSUMS" ]] || { echo "✗ falta el checksum del APK"; exit 1; }
          [[ -n "$APKVERIFY" && -s "$APKVERIFY" ]] || { echo "✗ falta la evidencia de verificación del APK"; exit 1; }
          # El APK debe estar FIRMADO: evidencia de apksigner dentro del artifact
          grep -q "Verified using v2 scheme" "$APKVERIFY" || { echo "✗ el APK no pasó apksigner verify"; exit 1; }
          grep -q "Verified using v3 scheme" "$APKVERIFY" || { echo "✗ el APK no pasó apksigner v3"; exit 1; }
          echo "✓ conjunto completo: Setup.exe + .deb + CLI AppImage + APK firmado + checksums"

      - name: SHA256SUMS.txt consolidado (nombres públicos)
        run: |
          cd artifacts
          # re-computar sobre los archivos REALES con sus nombres finales
          # (incluye el APK del generador Android y el Manual de Usuario — TODOS
          # los binarios/documentos del release)
          find . ../dist/manual -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "ViewLBA-License-Generator-v*.apk" -o -name "ViewLBA-Manual-Usuario-v*.pdf" \) -print0 \
            | while IFS= read -r -d '' f; do b=$(basename "$f"); sha256sum "$f" | awk -v b="$b" '{print $1 "  " b}'; done > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          # sanity: 5+ entradas (exe, deb, CLI appimage + APK + manual)
          LINES=$(wc -l < ../SHA256SUMS.txt)
          [[ "$LINES" -ge 5 ]] || { echo "✗ menos de 5 binarios/documentos en el release"; exit 1; }

      - name: Crear Release (SOLO artefactos ya validados — cero recompilación)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SHA256SUMS.txt
            dist/manual/ViewLBA-Manual-Usuario-v*.pdf
            artifacts/**/ViewLBA-Server-Setup-*.exe
            artifacts/**/ViewLBA-Server-*-x86_64.deb
            artifacts/**/ViewLBA-Server-CLI-*.AppImage
            artifacts/**/ViewLBA-License-Generator-v*.apk
            artifacts/**/LicenseGenerator-SHA256SUMS.txt
            artifacts/**/LicenseGenerator-VERIFY.txt
            artifacts/**/*.sha256
            artifacts/**/manifest-*.json
          # tags -rc.N / -beta.N se publican como prerelease (FASE 23)
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
