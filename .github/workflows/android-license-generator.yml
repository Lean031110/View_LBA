name: Android License Generator

# Pipeline de publicación del generador Android (FASES 1-8, release 3.0.0).
#
# CONTRATO: este workflow NUNCA produce un APK sin firmar. Si faltan los
# 4 secrets de firma (VIEWLBA_KEYSTORE_*), el gate falla con:
#   "Release signing secrets are required. Refusing to publish unsigned APK."
# El flujo canónico (ver .github/actions/android-apk/action.yml):
#   assembleRelease (unsigned) → zipalign → apksigner sign v1+v2+v3
#   → apksigner verify → zipalign -c → badging → unzip -t → checksum → artifact
#
# NOTA: los TAGS v* NO se construyen aquí — los construye el job android de
# release-installer.yml con el MISMO action compuesto (una sola definición
# del pipeline). Así no hay builds duplicados ni carreras entre workflows.
# push a main SIN filtro de paths: la firma se verifica SIEMPRE.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "android-license-generator/**"
      - ".github/workflows/android-license-generator.yml"
      - ".github/actions/android-apk/**"
      - "VERSION"
  workflow_dispatch:

concurrency:
  group: android-license-generator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action en eventos pull_request lista los commits del PR vía API
  # (ScanPullRequest) → sin pull-requests:read responde 403.
  pull-requests: read

jobs:
  build:
    name: "Generador Android (lint · tests · seguridad · firma · verificación)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        # Historia COMPLETA: gitleaks escanea el rango del push (before..after)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Versión (única fuente de verdad: /VERSION)"
        run: |
          set -euo pipefail
          V=$(cat VERSION)
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[\w.]+)?$ ]] || { echo "::error::/VERSION inválido: $V"; exit 1; }
          echo "APK_VERSION=$V" >> "$GITHUB_ENV"
          echo "→ versión: $V"

      - name: "gitleaks (secretos en el historial — bloqueante)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      # Pipeline completo: Java/SDK/Gradle fijos, gate de secrets, lint,
      # tests JVM, seguridad, build, zipalign, apksigner v1+v2+v3, verify,
      # badging, unzip -t, análisis, branding, checksum, artifact.
      - name: "APK firmado y verificado (action compuesto)"
        uses: ./.github/actions/android-apk
        env:
          KEYSTORE_BASE64: ${{ secrets.VIEWLBA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIEWLBA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIEWLBA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIEWLBA_KEY_PASSWORD }}
        with:
          version-name: ${{ env.APK_VERSION }}

      - name: Resumen (sin secretos)
        run: |
          echo "### Generador Android — APK firmado" >> $GITHUB_STEP_SUMMARY
          echo "- Versión: \`${APK_VERSION}\` (fuente: /VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- Firma: apksigner v1+v2+v3 verificados; zipalign PASS; badging PASS" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: \`viewlba-license-generator\` (APK + SHA256SUMS + VERIFY)" >> $GITHUB_STEP_SUMMARY
