name: Windows Exit Diagnostics

# Diagnóstico AISLADO del cuelgue de salida del sidecar (builds 15-17 de
# v3.2.0): la instalación completa está SANA (39 s) pero el proceso no
# termina. Este workflow prueba CADA mecanismo de salida en un binario
# bun-compile REAL sobre windows-latest:
#   A) process.exit en binario compilado (sin hijos)
#   B) kernel32.ExitProcess vía FFI en binario compilado
#   C) process.exit tras spawnSync de un hijo que CIERRA los pipes pero
#      SIGUE VIVO (la simulación exacta del quirk prisma)
#   D) ExitProcess (FFI) en el mismo escenario C
#   E) Atomics.wait (gracia síncrona) funciona con el loop "colgado"
# Cada test imprime su duración y código de salida — la evidencia decide.

on:
  workflow_dispatch:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

jobs:
  exit-matrix:
    name: "Mecanismos de salida en bun-compile (Windows real)"
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: "Escribir los programas de prueba"
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/exitdiag"
          cat > "$RUNNER_TEMP/exitdiag/prog.ts" <<'EOF'
          // argv[2] = modo: A | B | C | D | E
          import { spawnSync } from "node:child_process"
          import { dlopen } from "bun:ffi"
          const mode = process.argv[2] ?? "A"

          function log(m: string) { console.log(`[${mode}] ${m}`) }
          function syncSleep(ms: number) {
            try { Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, ms) } catch {}
          }
          function osExit(code: number) {
            try {
              const k32 = dlopen("kernel32", { ExitProcess: { args: ["u32"], returns: "void" } })
              log(`FFI dlopen(kernel32) OK — llamando ExitProcess(${code})`)
              ;(k32.symbols.ExitProcess as (c: number) => void)(code)
              log("ERROR FATAL: ExitProcess REGRESÓ (no debía)")
            } catch (e) {
              log(`FFI FALLÓ: ${(e as Error).message}`)
              process.exit(code)
            }
          }

          // Hijo «prisma-like»: cierra stdout/stderr al salir pero el
          // PROCESO sigue vivo (setInterval forever) — reproduce el quirk.
          const CHILD_FILE = process.env.EXITDIAG_CHILD ?? ""
          const CHILD_NOTE = "hijo real desde archivo"

          log("inicio")
          if (mode === "C" || mode === "D") {
            const r = spawnSync(CHILD_FILE, [], {
              encoding: "utf8", timeout: 10_000,
              stdin: "ignore", stdio: ["ignore", "pipe", "pipe"], windowsHide: true,
            } as never)
            log(`spawnSync devolvió: status=${r.status} pid=${r.pid} stdout=${JSON.stringify((r.stdout||"").slice(0,40))}`)
            log(`nota: ${CHILD_NOTE}`)
          }
          if (mode === "E") {
            log("durmiendo 500 ms SÍNCRONOS (Atomics.wait)…")
            syncSleep(500)
            log("Atomics.wait REGRESÓ (el hilo principal no está bloqueado)")
          }
          log("llegando al mecanismo de salida")
          syncSleep(200)
          if (mode === "A" || mode === "C") {
            log(`process.exit(77)`)
            process.exit(77)
          } else if (mode === "F") {
            // TERMINATE de uno mismo: sin notificaciones DLL — el más duro
            try {
              const k32 = dlopen("kernel32", {
                GetCurrentProcess: { args: [], returns: "ptr" },
                TerminateProcess: { args: ["ptr", "u32"], returns: "bool" },
              })
              log("TerminateProcess(GetCurrentProcess())…")
              const proc = (k32.symbols.GetCurrentProcess as () => unknown)()
              const ok = (k32.symbols.TerminateProcess as (h: unknown, c: number) => boolean)(proc, 77)
              log(`ERROR FATAL: TerminateProcess devolvió ${ok}`)
            } catch (e) {
              log(`TerminateProcess FFI FALLÓ: ${(e as Error).message}`)
              process.exit(77)
            }
          } else {
            osExit(77)
          }
          log("INALCANZABLE")
          while (true) { syncSleep(1000) }
          EOF
          cat > "$RUNNER_TEMP/exitdiag/child.ts" <<'EOF'
          // Hijo «prisma-like»: imprime su salida ÚTIL y luego NO termina
          // (intervalo eterno, stdout cerrado) — reproduce el quirk de los
          // hijos del CLI de prisma en Windows.
          console.log("hijo: salida útil antes de cerrar stdout")
          process.stdout.end?.()
          setInterval(() => {}, 1000)
          EOF
          bun build --compile "$RUNNER_TEMP/exitdiag/child.ts" --outfile "$RUNNER_TEMP/exitdiag/child.exe" >/dev/null 2>&1 || echo "⚠ compile child falló"
          echo "listo"

      - name: "Compilar A/B/C/D/E (bun build --compile)"
        shell: bash
        run: |
          for M in A B C D E F; do
            bun build --compile "$RUNNER_TEMP/exitdiag/prog.ts" --outfile "$RUNNER_TEMP/exitdiag/prog-$M" >/dev/null 2>&1 || { echo "✗ compile $M falló"; exit 1; }
          done
          echo "✓ 6 binarios compilados"

      - name: "A) process.exit (sin hijos) — ¿termina?"
        shell: pwsh
        run: |
          $t0 = Get-Date
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\exitdiag\prog-A.exe" -ArgumentList "A" -PassThru -Wait -NoNewWindow -RedirectStandardOutput $env:RUNNER_TEMP\exitdiag\a-out.txt
          $dt = ((Get-Date) - $t0).TotalSeconds
          Write-Host "A: exit=$($p.ExitCode) duración=$([math]::Round($dt,1))s"
          Get-Content $env:RUNNER_TEMP\exitdiag\a-out.txt | ForEach-Object { Write-Host "  $_" }
          if ($dt -gt 15) { Write-Host "✗ A COLGADO"; exit 1 }

      - name: "B) ExitProcess vía FFI (sin hijos) — ¿termina?"
        shell: pwsh
        run: |
          $t0 = Get-Date
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\exitdiag\prog-B.exe" -ArgumentList "B" -PassThru -Wait -NoNewWindow -RedirectStandardOutput $env:RUNNER_TEMP\exitdiag\b-out.txt
          $dt = ((Get-Date) - $t0).TotalSeconds
          Write-Host "B: exit=$($p.ExitCode) duración=$([math]::Round($dt,1))s"
          Get-Content $env:RUNNER_TEMP\exitdiag\b-out.txt | ForEach-Object { Write-Host "  $_" }
          if ($dt -gt 15) { Write-Host "✗ B COLGADO"; exit 1 }

      - name: "E) Atomics.wait — ¿el hilo principal vive?"
        shell: pwsh
        run: |
          $t0 = Get-Date
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\exitdiag\prog-E.exe" -ArgumentList "E" -PassThru -Wait -NoNewWindow -RedirectStandardOutput $env:RUNNER_TEMP\exitdiag\e-out.txt
          $dt = ((Get-Date) - $t0).TotalSeconds
          Write-Host "E: exit=$($p.ExitCode) duración=$([math]::Round($dt,1))s"
          Get-Content $env:RUNNER_TEMP\exitdiag\e-out.txt | ForEach-Object { Write-Host "  $_" }

      - name: "C) process.exit TRAS hijo vivo — ¿termina?"
        shell: pwsh
        timeout-minutes: 3
        run: |
          $t0 = Get-Date
          $env:EXITDIAG_CHILD = "$env:RUNNER_TEMP\exitdiag\child.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\exitdiag\prog-C.exe" -ArgumentList "C" -PassThru -NoNewWindow -RedirectStandardOutput $env:RUNNER_TEMP\exitdiag\c-out.txt
          if (-not ($p.WaitForExit(60000))) {
            Write-Host "C: ✗ COLGADO (60 s) — process.exit no termina con hijo vivo"
            taskkill /PID $p.Id /T /F | Out-Null
            Get-Content $env:RUNNER_TEMP\exitdiag\c-out.txt | ForEach-Object { Write-Host "  $_" }
            exit 0   # diagnóstico: NO fallar el workflow
          }
          $dt = ((Get-Date) - $t0).TotalSeconds
          Write-Host "C: ✓ exit=$($p.ExitCode) duración=$([math]::Round($dt,1))s"
          Get-Content $env:RUNNER_TEMP\exitdiag\c-out.txt | ForEach-Object { Write-Host "  $_" }

      - name: "D) ExitProcess (FFI) TRAS hijo vivo — ¿termina?"
        shell: pwsh
        timeout-minutes: 3
        run: |
          $t0 = Get-Date
          $env:EXITDIAG_CHILD = "$env:RUNNER_TEMP\exitdiag\child.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\exitdiag\prog-D.exe" -ArgumentList "D" -PassThru -NoNewWindow -RedirectStandardOutput $env:RUNNER_TEMP\exitdiag\d-out.txt
          if (-not ($p.WaitForExit(60000))) {
            Write-Host "D: ✗ COLGADO (60 s) — ExitProcess no termina con hijo vivo (!)"
            taskkill /PID $p.Id /T /F | Out-Null
            Get-Content $env:RUNNER_TEMP\exitdiag\d-out.txt | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          $dt = ((Get-Date) - $t0).TotalSeconds
          Write-Host "D: ✓ exit=$($p.ExitCode) duración=$([math]::Round($dt,1))s"
          Get-Content $env:RUNNER_TEMP\exitdiag\d-out.txt | ForEach-Object { Write-Host "  $_" }

      - name: "F) TerminateProcess(GetCurrentProcess) — el más duro"
        shell: pwsh
        timeout-minutes: 3
        run: |
          $t0 = Get-Date
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\exitdiag\prog-F.exe" -ArgumentList "F" -PassThru -NoNewWindow -RedirectStandardOutput $env:RUNNER_TEMP\exitdiag\f-out.txt
          if (-not ($p.WaitForExit(60000))) {
            Write-Host "F: ✗ COLGADO (60 s) — TerminateProcess no terminó (!)"
            taskkill /PID $p.Id /T /F | Out-Null
            Get-Content $env:RUNNER_TEMP\exitdiag\f-out.txt | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          $dt = ((Get-Date) - $t0).TotalSeconds
          Write-Host "F: ✓ exit=$($p.ExitCode) duración=$([math]::Round($dt,1))s"
          Get-Content $env:RUNNER_TEMP\exitdiag\f-out.txt | ForEach-Object { Write-Host "  $_" }

      - name: "Resumen de la matriz"
        shell: bash
        run: |
          echo "=== Matriz de salida (windows-latest, bun 1.4.2 compile) ==="
          for f in a b c d e f; do echo "--- $f ---"; cat "$RUNNER_TEMP/exitdiag/$f-out.txt" 2>/dev/null | tail -6; done
