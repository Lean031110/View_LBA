[package]
name = "viewlba-installer-gui"
version = "1.2.1"
description = "ViewLBA Server — Instalador oficial y gestor (GUI Tauri)"
authors = ["Lean031110"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "viewlba_installer_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
