[package]
name = "viewlba-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ViewLBA Server — native Windows service host (SCM-registered, supervises App + Realtime + Stream children). No NSSM, no PowerShell, no CMD."

[[bin]]
name = "viewlba-service"
path = "src/main.rs"

[dependencies]
# Microsoft official `windows` crate — higher-level, stable API surface.
# Replaces windows-sys + windows-service crates (which had API mismatches in v0.7).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security_Authorization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Diagnostics_Debug",
] }

# Logging
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# HTTP client for health checks (sync, lightweight, no TLS bloat for localhost)
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# CLI parsing (minimal)
pico-args = "0.5"
