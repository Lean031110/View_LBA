[package]
name = "viewlba-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ViewLBA Server — native Windows service host (SCM-registered, supervises App + Realtime + Stream children). No NSSM, no PowerShell, no CMD."

[[bin]]
name = "viewlba-service"
path = "src/main.rs"

[dependencies]
# windows-rs: low-level Win32 APIs (named pipe, handle, security attrs)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

# windows-service: higher-level SCM dispatcher (StartServiceCtrlDispatcher, SetServiceStatus)
windows-service = "0.7"

# Logging
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# HTTP client for health checks (sync, lightweight)
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# CLI parsing (minimal)
pico-args = "0.5"
