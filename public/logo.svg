  <!-- Tagline -->
  <text x="462" y="340" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="40" letter-spacing="15" fill="#8B8D98">SEÑALIZACIÓN DIGITAL</text>
